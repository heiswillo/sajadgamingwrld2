<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="form-container">

<h2>Create Account</h2>

<form id="registerForm">

<input type="text"
       id="username"
       placeholder="Username"
       required>

<input type="email"
       id="email"
       placeholder="Email"
       required>

<input type="password"
       id="password"
       placeholder="Password"
       required>

<button type="submit">
Register
</button>

</form>

</div>

<script src="js/script.js"></script>

</body>
</html>
